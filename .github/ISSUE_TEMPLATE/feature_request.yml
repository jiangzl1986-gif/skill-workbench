name: 创作场景与功能建议 / Feature request
description: 描述你希望怎样使用 Skill 画布 / Describe your Skill creation use case
body:
  - type: textarea
    attributes:
      label: 你想完成什么 / What do you want to do?
      description: 从具体创作过程描述当前困难和理想操作。Describe your workflow, the difficulty and the desired behavior.
    validations:
      required: true
  - type: textarea
    attributes:
      label: 示例与验收 / Example and success criteria
      description: 提供不含私有资料的例子，以及怎样判断功能有用。Use a public example and explain what would make the feature useful.
